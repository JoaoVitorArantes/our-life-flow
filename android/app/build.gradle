plugins {
    id "com.android.application"
}

// Trusted Web Activity wrapper for the hosted Life OS (SSR + server functions + Google OAuth).
// The app opens https://lifejvrenii.com in Chrome full-screen; no web code is bundled.
def twa = [
    host        : "lifejvrenii.com",
    launchUrl   : "/dashboard",
    name        : "Life OS",
    themeColor  : "#0B0D10",
    navColor    : "#0B0D10",
    background  : "#0B0D10",
]

// Optional local signing config (never committed). See docs/android-play.md.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))

android {
    namespace "com.joaovitorarantes.lifeos"
    compileSdk 36

    defaultConfig {
        applicationId "com.joaovitorarantes.lifeos"
        minSdk 23
        targetSdk 36
        // Increment versionCode on EVERY Play upload; bump versionName for user-visible releases.
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            hostName       : twa.host,
            defaultUrl     : "https://${twa.host}${twa.launchUrl}",
            launcherName   : twa.name,
            themeColor     : twa.themeColor,
            navigationColor: twa.navColor,
            backgroundColor: twa.background,
        ]
        resValue "string", "app_name", twa.name
        resValue "string", "launchUrl", "https://${twa.host}${twa.launchUrl}"
        resValue "color", "colorPrimary", twa.themeColor
        resValue "color", "backgroundColor", twa.background
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.2"
}
